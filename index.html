<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروعي الأول البرمجي</title>
    
    <style>
        /* التنسيقات العامة للصفحة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* البطاقة الرئيسية */
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .badge {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
            font-size: 15px;
        }

        /* الزر التفاعلي */
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 26px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #7dd3fc;
        }

        /* رسالة التفاعل */
        #output {
            margin-top: 20px;
            font-size: 15px;
            color: #4ade80;
            font-weight: 500;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <!-- المحتوى المرئي داخل الصفحة -->
    <div class="card">
        <span class="badge">🚀 مبرمج مبتدئ</span>
        <h1>مرحباً بك في صفحتي الأولى!</h1>
        <p>هذه أول صفحة ويب أقوم ببرمجتها باستخدام HTML و CSS و JavaScript. الخطوة القادمة هي رفعها على GitHub!</p>
        
        <button class="btn" onclick="sayHello()">اضغط هنا للترحيب 👋</button>
        
        <div id="output"></div>
    </div>

    <!-- كود الجافاسكربت للتفاعل -->
    <script>
        let count = 0;
        function sayHello() {
            count++;
            const output = document.getElementById('output');
            output.textContent = `أهلاً بك! لقد ضغطت على الزر ${count} مرة 🎉`;
        }
    </script>

</body>
</html>
